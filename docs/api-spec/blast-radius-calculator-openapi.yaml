            region: us-east-1
            usersInRegion: 145000
          customerTierImpact:
          - tier: ENTERPRISE
            slaBreachRisk: CRITICAL
            revenueAtRiskUSDPerHour: 45000.0
            usersAffected: 1200
          - tier: ENTERPRISE
            slaBreachRisk: CRITICAL
            revenueAtRiskUSDPerHour: 45000.0
            usersAffected: 1200
