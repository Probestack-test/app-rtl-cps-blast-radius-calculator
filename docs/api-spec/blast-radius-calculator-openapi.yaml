      description: Invalid request payload or missing required fields.
    NotFound:
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"
      description: Analysis ID or service not found.
    InternalError:
      content:
        application/json:
          schema:
