openapi: 3.0.3
info:
  contact:
    email: release-eng@forgesphere.example.com
    name: ForgeSphere Release Engineering
  description: "Pre-deployment impact analysis engine. Before a change reaches production,\
    \ \ncalculates exactly how many users, revenue, regions, and downstream services\
    \ \nwould be affected if it goes wrong. Uses the service dependency graph, live\
    \ \ntraffic patterns, customer tiers, and revenue attribution to answer the \n\
    question every release manager asks: \"What's the worst-case scenario?\"\nProvides\
    \ data-driven recommendations for canary percentage, rollback \ntriggers, and\
    \ deploy timing.\n"
  title: Blast Radius Calculator
  version: 1.0.0
servers:
- description: Production Server
  url: https://blastradius.forgesphere.lightning.com/v1
- description: Local Development Server
  url: http://localhost:8146/v1
security:
- bearerAuth: []
tags:
- description: Analyze change impact before deployment.
  name: Blast Radius
paths:
  /blast-radius:
    get:
      description: "Returns a paginated list of previous blast radius analyses. Used\
        \ by \nrelease managers to track deploy risk over time and by auditors to\
        \ \nverify that high-impact changes were reviewed with proper caution.\n"
      operationId: listBlastRadiusAnalyses
      parameters:
      - description: Filter by target service.
        example: payment-processor
        explode: true
        in: query
        name: targetService
        required: false
        schema:
          type: string
        style: form
      - description: Filter by environment.
        explode: true
        in: query
        name: environment
        required: false
        schema:
          enum:
          - STAGING
          - PRODUCTION
          type: string
        style: form
      - description: Filter by computed risk level.
        example: HIGH
        explode: true
        in: query
        name: riskLevel
        required: false
        schema:
          enum:
          - MINIMAL
          - LOW
          - MEDIUM
          - HIGH
          - CATASTROPHIC
          type: string
        style: form
      - description: Filter by change type.
        explode: true
        in: query
        name: changeType
        required: false
        schema:
          enum:
          - FEATURE
          - BUGFIX
          - HOTFIX
          - CONFIG_CHANGE
          - INFRA_CHANGE
          - DEPENDENCY_UPGRADE
          - DATABASE_MIGRATION
          - API_CONTRACT_CHANGE
          - ROLLBACK
          type: string
        style: form
      - description: Only include analyses that required approval.
        explode: true
        in: query
        name: requiresApproval
        required: false
        schema:
          type: boolean
        style: form
      - description: Only include analyses after this time.
        explode: true
        in: query
        name: fromDate
        required: false
        schema:
          format: date-time
          type: string
        style: form
      - description: Only include analyses before this time.
        explode: true
        in: query
        name: toDate
        required: false
        schema:
          format: date-time
          type: string
        style: form
      - description: Page number (zero-based).
        explode: true
        in: query
        name: page
        required: false
        schema:
          default: 0
          type: integer
        style: form
      - description: Number of items per page.
        explode: true
        in: query
        name: size
        required: false
        schema:
          default: 20
          maximum: 100
          type: integer
        style: form
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AnalysisList"
          description: List of analyses retrieved successfully.
        "400":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
          description: Invalid request payload or missing required fields.
        "500":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
          description: Internal server error.
      summary: List past blast radius analyses
      tags:
      - Blast Radius
      x-accepts: application/json
      x-tags:
      - tag: Blast Radius
    post:
      description: "Accepts a change descriptor (target service, version, change type)\
        \ \nand calculates the blast radius — what happens if this change breaks?\
        \ \nTraces the full dependency graph upstream and downstream, matches \ntraffic\
        \ to customer tiers, and computes user/revenue/regional impact. \nReturns\
        \ recommended canary percentage, rollback triggers, and deploy \nwindow.\n"
      operationId: analyzeBlastRadius
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/analyzeBlastRadius_request"
        required: true
      responses:
        "202":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/BlastRadiusAnalysis"
          description: Blast radius analysis accepted and running.
        "400":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
          description: Invalid request payload or missing required fields.
        "404":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
          description: Target service not found in dependency graph.
        "500":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
          description: Internal server error.
      summary: Analyze the blast radius of a proposed production change
      tags:
      - Blast Radius
      x-content-type: application/json
      x-accepts: application/json
      x-tags:
      - tag: Blast Radius
  /blast-radius/{analysisId}:
    get:
      description: "Returns the complete blast radius report — every downstream consumer,\
        \ \nevery affected user tier, revenue attribution, regional impact, and \n\
        the full recommendation set. The most important output is the \n`recommendations`\
        \ object: canary percentage, rollback triggers, \ndeploy window, and approval\
        \ requirements.\n"
      operationId: getBlastRadiusAnalysis
      parameters:
      - description: Unique identifier of the analysis.
        example: 9c8f1a3b-6d7e-4a12-8f5e-123456789abc
        explode: false
        in: path
        name: analysisId
        required: true
        schema:
          format: uuid
          type: string
        style: simple
      - description: Include the full dependency graph.
        example: true
        explode: true
        in: query
        name: includeDependencyGraph
        required: false
        schema:
          default: true
          type: boolean
        style: form
      - description: Include per-tier revenue impact.
        example: true
        explode: true
        in: query
        name: includeRevenueBreakdown
        required: false
        schema:
          default: true
          type: boolean
        style: form
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/BlastRadiusAnalysis"
          description: Blast radius analysis retrieved successfully.
        "404":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
          description: Analysis ID or service not found.
        "500":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
          description: Internal server error.
      summary: Get detailed blast radius analysis
      tags:
      - Blast Radius
      x-accepts: application/json
      x-tags:
      - tag: Blast Radius
  /blast-radius/{analysisId}/simulate:
    post:
      description: "Runs what-if simulations against the blast radius analysis. Answers\
        \ \nquestions like: \"What happens if this change causes a 5% error rate?\"\
        , \n\"What if it breaks at peak traffic?\", \"What if a downstream service\
        \ \ntimes out?\" Returns quantified impact for each scenario plus \nautomated\
        \ rollback recommendations.\n"
      operationId: simulateFailures
      parameters:
      - description: Unique identifier of the blast radius analysis.
        example: 9c8f1a3b-6d7e-4a12-8f5e-123456789abc
        explode: false
        in: path
        name: analysisId
        required: true
        schema:
          format: uuid
          type: string
        style: simple
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/simulateFailures_request"
        required: true
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/FailureSimulation"
          description: Simulation results with quantified impact.
        "400":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
          description: Invalid request payload or missing required fields.
        "404":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
          description: Analysis ID or service not found.
        "500":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
          description: Internal server error.
      summary: Simulate failure scenarios for the analyzed change
      tags:
      - Blast Radius
      x-content-type: application/json
      x-accepts: application/json
      x-tags:
      - tag: Blast Radius
components:
  responses:
    BadRequest:
      content:
        application/json:
          schema:
