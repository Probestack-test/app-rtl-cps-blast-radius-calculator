openapi: 3.1.0
info:
  title: Blast Radius Calculator
  description: "Pre-deployment impact analysis engine. Before a change reaches production,\
    \  calculates exactly how many users, revenue, regions, and downstream services\
    \  would be affected if it goes wrong. Uses the service dependency graph, live\
    \  traffic patterns, customer tiers, and revenue attribution to answer the  question\
    \ every release manager asks: \"What's the worst-case scenario?\" Provides data-driven\
    \ recommendations for canary percentage, rollback  triggers, and deploy timing. "
  contact:
    name: ForgeSphere Release Engineering
    email: release-eng@forgesphere.example.com
  version: 1.0.0
servers:
- url: http://127.0.0.1:18080
  description: Generated server url
tags:
- name: Blast Radius
  description: Analyze change impact before deployment.
paths:
  /actuator/health:
    get:
      tags:
      - Health
      summary: Health
      operationId: getHealth
      responses:
        "200":
          description: Monitoring data returned successfully
          content:
            application/json:
              schema:
                type: object
  /actuator/health/liveness:
    get:
      tags:
      - Health
      summary: Liveness
      operationId: getLiveness
      responses:
        "200":
          description: Monitoring data returned successfully
          content:
            application/json:
              schema:
                type: object
  /actuator/health/readiness:
    get:
      tags:
      - Health
      summary: Readiness
      operationId: getReadiness
      responses:
        "200":
          description: Monitoring data returned successfully
          content:
            application/json:
              schema:
                type: object
  /actuator/metrics:
    get:
      tags:
      - Health
      summary: Metrics
      operationId: getMetrics
      responses:
        "200":
          description: Monitoring data returned successfully
          content:
            application/json:
              schema:
                type: object
  /actuator/prometheus:
    get:
      tags:
      - Health
      summary: Prometheus
      operationId: getPrometheusMetrics
      responses:
        "200":
          description: Prometheus metrics returned successfully
          content:
            text/plain:
              schema:
                type: string
  /oauth2/token:
    post:
      tags:
      - Security
      summary: Get OAuth2 Token
      description: Uses the OAuth 2.0 client credentials grant. Authenticate the client
        with HTTP Basic credentials and submit grant_type=client_credentials.
      operationId: getOAuth2Token
      requestBody:
        content:
          application/x-www-form-urlencoded:
            schema:
              type: object
              properties:
                grant_type:
                  type: string
                  default: client_credentials
                  description: OAuth 2.0 grant type
                  enum:
                  - client_credentials
                scope:
                  type: string
                  description: Space-delimited scopes
                  example: api.read api.write
              required:
              - grant_type
        required: true
      responses:
        "200":
          description: Access token issued successfully
          content:
            application/json:
              schema:
                type: object
                properties:
                  access_token:
                    type: string
                  token_type:
                    type: string
                    example: Bearer
                  expires_in:
                    type: integer
                    format: int32
                    example: 3600
                  scope:
                    type: string
                    example: api.read api.write
        "400":
          description: Invalid token request
        "401":
          description: Invalid client credentials
  /v1/blast-radius:
    get:
      tags:
      - Blast Radius
      summary: List past blast radius analyses
      description: 'Returns a paginated list of previous blast radius analyses. Used
        by  release managers to track deploy risk over time and by auditors to  verify
        that high-impact changes were reviewed with proper caution. '
      operationId: listBlastRadiusAnalyses
      parameters:
      - name: targetService
        in: query
        description: Filter by target service.
        required: false
        schema:
          type: string
      - name: environment
        in: query
        description: Filter by environment.
        required: false
        schema:
          type: string
      - name: riskLevel
        in: query
        description: Filter by computed risk level.
        required: false
        schema:
          type: string
      - name: changeType
        in: query
        description: Filter by change type.
        required: false
        schema:
          type: string
      - name: requiresApproval
        in: query
        description: Only include analyses that required approval.
        required: false
        schema:
          type: boolean
      - name: fromDate
        in: query
        description: Only include analyses after this time.
        required: false
        schema:
          type: string
          format: date-time
      - name: toDate
        in: query
        description: Only include analyses before this time.
        required: false
        schema:
          type: string
          format: date-time
      - name: page
        in: query
        description: Page number (zero-based).
        required: false
        schema:
          type: integer
          format: int32
          default: 0
      - name: size
        in: query
        description: Number of items per page.
        required: false
        schema:
          type: integer
          format: int32
          default: 20
          maximum: 100
      responses:
        "200":
          description: List of analyses retrieved successfully.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AnalysisList"
        "400":
          description: Invalid request payload or missing required fields.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "500":
          description: Internal server error.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
      security:
      - bearerAuth: []
    post:
      tags:
      - Blast Radius
      summary: Analyze the blast radius of a proposed production change
      description: "Accepts a change descriptor (target service, version, change type)\
        \  and calculates the blast radius — what happens if this change breaks? \
        \ Traces the full dependency graph upstream and downstream, matches  traffic\
        \ to customer tiers, and computes user/revenue/regional impact.  Returns recommended\
        \ canary percentage, rollback triggers, and deploy  window. "
      operationId: analyzeBlastRadius
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AnalyzeBlastRadiusRequest"
        required: true
      responses:
        "202":
          description: Blast radius analysis accepted and running.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/BlastRadiusAnalysis"
        "400":
          description: Invalid request payload or missing required fields.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "404":
          description: Target service not found in dependency graph.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "500":
          description: Internal server error.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
      security:
      - bearerAuth: []
  /v1/blast-radius/{analysisId}/simulate:
    post:
      tags:
      - Blast Radius
      summary: Simulate failure scenarios for the analyzed change
      description: "Runs what-if simulations against the blast radius analysis. Answers\
        \  questions like: \"What happens if this change causes a 5% error rate?\"\
        ,  \"What if it breaks at peak traffic?\", \"What if a downstream service\
        \  times out?\" Returns quantified impact for each scenario plus  automated\
        \ rollback recommendations. "
      operationId: simulateFailures
      parameters:
      - name: analysisId
        in: path
        description: Unique identifier of the blast radius analysis.
        required: true
        schema:
          type: string
          format: uuid
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/SimulateFailuresRequest"
        required: true
      responses:
        "200":
          description: Simulation results with quantified impact.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/FailureSimulation"
        "400":
          description: Invalid request payload or missing required fields.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "404":
          description: Analysis ID or service not found.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "500":
          description: Internal server error.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
      security:
      - bearerAuth: []
  /v1/blast-radius/{analysisId}:
    get:
      tags:
      - Blast Radius
      summary: Get detailed blast radius analysis
      description: "Returns the complete blast radius report — every downstream consumer,\
        \  every affected user tier, revenue attribution, regional impact, and  the\
        \ full recommendation set. The most important output is the  `recommendations`\
        \ object: canary percentage, rollback triggers,  deploy window, and approval\
        \ requirements. "
      operationId: getBlastRadiusAnalysis
      parameters:
      - name: analysisId
        in: path
        description: Unique identifier of the analysis.
        required: true
        schema:
          type: string
          format: uuid
      - name: includeDependencyGraph
        in: query
        description: Include the full dependency graph.
        required: false
        schema:
          type: boolean
          default: true
      - name: includeRevenueBreakdown
        in: query
        description: Include per-tier revenue impact.
        required: false
        schema:
          type: boolean
          default: true
      responses:
        "200":
          description: Blast radius analysis retrieved successfully.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/BlastRadiusAnalysis"
        "404":
          description: Analysis ID or service not found.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "500":
          description: Internal server error.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
      security:
      - bearerAuth: []
components:
  schemas:
    BlastRadiusAnalysis:
      type: object
      properties:
        analysisId:
          type: string
          format: uuid
          example: 9c8f1a3b-6d7e-4a12-8f5e-123456789abc
        targetService:
          type: string
          example: payment-processor
        targetVersion:
          type: string
          example: v2.5.0
        currentVersion:
          type: string
          example: v2.4.1
        environment:
          type: string
          enum:
          - STAGING
          - PRODUCTION
          example: PRODUCTION
        changeType:
          type: string
          enum:
          - FEATURE
          - BUGFIX
          - HOTFIX
          - CONFIG_CHANGE
          - INFRA_CHANGE
          - DEPENDENCY_UPGRADE
          - DATABASE_MIGRATION
          - API_CONTRACT_CHANGE
          - ROLLBACK
          example: API_CONTRACT_CHANGE
        changeSummary:
          type: string
          example: Removing discount_code field from /charge request; adding discount_v2
            field.
        status:
          type: string
          enum:
          - QUEUED
          - TRACING_DEPENDENCIES
          - ANALYZING_TRAFFIC
          - CALCULATING_IMPACT
          - COMPLETED
          - FAILED
          example: COMPLETED
        riskLevel:
          type: string
          description: Overall computed risk.
          enum:
          - MINIMAL
          - LOW
          - MEDIUM
          - HIGH
          - CATASTROPHIC
          example: HIGH
        riskScore:
          type: number
          description: Numeric risk score.
          example: 78
          maximum: 100
          minimum: 0
        submittedAt:
          type: string
          format: date-time
        completedAt:
          type: string
          format: date-time
        requestedBy:
          type: string
          example: amit.kumar@forgesphere.example.com
        impact:
          $ref: "#/components/schemas/BlastRadiusAnalysisImpact"
        dependencyGraph:
          $ref: "#/components/schemas/BlastRadiusAnalysis_dependencyGraph"
        recommendations:
          $ref: "#/components/schemas/BlastRadiusAnalysisRecommendations"
        aiSummary:
          type: string
          description: AI-generated plain-English summary.
          example: "HIGH risk change. If this fails at 5% error rate during peak,\
            \ 245K users and $125K/hour revenue are at risk. Enterprise tier (1200\
            \ users) has no fallback. Recommendation: 2% canary at 2 AM, auto-rollback\
            \ at 1% error rate, requires VP+ approval."
        auditReference:
          type: string
          example: audit://blast-radius/analysis-9c8f1a3b
      required:
      - analysisId
      - environment
      - impact
      - recommendations
      - riskLevel
      - status
      - submittedAt
      - targetService
      - targetVersion
    BlastRadiusAnalysisDependencyGraphEdgesInner:
      type: object
      properties:
        from:
          type: string
          example: checkout-service
        to:
          type: string
          example: payment-processor
        callVolumePerMinute:
          type: integer
          format: int32
          example: 4200
        hasFallback:
          type: boolean
          example: false
    BlastRadiusAnalysisDependencyGraphNodesInner:
      type: object
      properties:
        serviceName:
          type: string
          example: payment-processor
        tier:
          type: string
          enum:
          - TARGET
          - DIRECT_CONSUMER
          - INDIRECT_CONSUMER
          - DOWNSTREAM
          example: TARGET
        estimatedImpactPercent:
          type: number
          format: double
          example: 100.0
    BlastRadiusAnalysisImpact:
      type: object
      properties:
        usersAffected:
          type: integer
          format: int32
          description: Estimated users hit if the change fails.
          example: 245000
        usersAffectedPercent:
          type: number
          format: double
          description: Percentage of total user base.
          example: 18.5
        directConsumers:
          type: array
          description: Services that directly call the target service.
          items:
            $ref: "#/components/schemas/BlastRadiusAnalysisImpactDirectConsumersInner"
        downstreamServices:
          type: integer
          format: int32
          description: Total downstream services in the dependency chain.
          example: 14
        downstreamDepth:
          type: integer
          format: int32
          description: Maximum depth of the dependency chain.
          example: 4
        regionsAffected:
          type: array
          description: Geographic regions impacted.
          items:
            $ref: "#/components/schemas/BlastRadiusAnalysisImpactRegionsAffectedInner"
        customerTierImpact:
          type: array
          description: Impact broken down by customer tier.
          items:
            $ref: "#/components/schemas/BlastRadiusAnalysisImpactCustomerTierImpactInner"
        revenueAtRiskUSDPerHour:
          type: number
          format: double
          description: Total revenue at risk per hour.
          example: 125000.0
        dataLossRisk:
          type: string
          enum:
          - NONE
          - LOW
          - MEDIUM
          - HIGH
          - CATASTROPHIC
          example: MEDIUM
      required:
      - directConsumers
      - downstreamServices
      - regionsAffected
      - usersAffected
    BlastRadiusAnalysisImpactCustomerTierImpactInner:
      type: object
      properties:
        tier:
          type: string
          enum:
          - ENTERPRISE
          - PRO
          - FREE
          - ANONYMOUS
          example: ENTERPRISE
        usersAffected:
          type: integer
          format: int32
          example: 1200
        revenueAtRiskUSDPerHour:
          type: number
          format: double
          example: 45000.0
        slaBreachRisk:
          type: string
          enum:
          - LOW
          - MEDIUM
          - HIGH
          - CRITICAL
          example: CRITICAL
    BlastRadiusAnalysisImpactDirectConsumersInner:
      type: object
      properties:
        serviceName:
          type: string
          example: checkout-service
        trafficSharePercent:
          type: number
          format: double
          description: How much traffic this consumer sends.
          example: 42.5
        criticality:
          type: string
          enum:
          - TIER_0
          - TIER_1
          - TIER_2
          - TIER_3
          example: TIER_0
        fallbackAvailable:
          type: boolean
          description: Whether this consumer has a fallback path.
          example: false
      required:
      - criticality
      - serviceName
      - trafficSharePercent
    BlastRadiusAnalysisImpactRegionsAffectedInner:
      type: object
      properties:
        region:
          type: string
          example: us-east-1
        usersInRegion:
          type: integer
          format: int32
          example: 145000
        trafficPercent:
          type: number
          format: double
          example: 62.5
    BlastRadiusAnalysisRecommendations:
      type: object
      properties:
        recommendedCanaryPercent:
          type: integer
          format: int32
          description: Suggested initial canary traffic %.
          example: 2
          maximum: 100
          minimum: 1
        rollbackTriggers:
          type: array
          description: Metrics that should trigger automatic rollback.
          items:
            $ref: "#/components/schemas/BlastRadiusAnalysisRecommendationsRollbackTriggersInner"
        deployWindow:
          $ref: "#/components/schemas/BlastRadiusAnalysisRecommendationsDeployWindow"
        requiresApproval:
          type: boolean
          example: true
        requiredApprovers:
          type: array
          description: Who must approve before deploy.
          example:
          - vp-engineering@forgesphere.example.com
          - ciso@forgesphere.example.com
          items:
            type: string
        preDeployChecks:
          type: array
          description: Additional checks required before deploying.
          example:
          - Contract Chronicle verification passed
          - Shadow Mirror 24h with 10% traffic
          - Rollback Commander ready with previous version
          items:
            type: string
        warningNotes:
          type: array
          example:
          - Enterprise customers use /charge exclusively — SLA impact is severe.
          - No fallback path exists in checkout-service; cascade risk is high.
          items:
            type: string
      required:
      - deployWindow
      - recommendedCanaryPercent
      - requiresApproval
      - rollbackTriggers
    BlastRadiusAnalysisRecommendationsDeployWindow:
      type: object
      properties:
        recommendedStart:
          type: string
          example: 2026-11-05T02:00:00Z
        recommendedEnd:
          type: string
          example: 2026-11-05T06:00:00Z
        reason:
          type: string
          example: Lowest traffic window; 90% less user impact than peak.
      required:
      - reason
      - recommendedEnd
      - recommendedStart
    BlastRadiusAnalysisRecommendationsRollbackTriggersInner:
      type: object
      properties:
        metric:
          type: string
          example: error_rate_pct
        threshold:
          type: number
          example: 1.0
        windowSeconds:
          type: integer
          format: int32
          example: 60
        action:
          type: string
          enum:
          - ALERT
          - PAUSE_ROLLOUT
          - AUTO_ROLLBACK
          example: AUTO_ROLLBACK
    BlastRadiusAnalysis_dependencyGraph:
      type: object
      description: Full dependency graph (if includeDependencyGraph=true).
      properties:
        nodes:
          type: array
          items:
            $ref: "#/components/schemas/BlastRadiusAnalysisDependencyGraphNodesInner"
        edges:
          type: array
          items:
            $ref: "#/components/schemas/BlastRadiusAnalysisDependencyGraphEdgesInner"
    ErrorResponse:
      type: object
      properties:
        status:
          type: integer
          format: int32
          example: 404
        errorCode:
          type: string
          example: SERVICE_NOT_IN_GRAPH
        message:
          type: string
          example: Service 'unknown-service' is not present in the dependency graph.
        timestamp:
          type: string
          format: date-time
        path:
          type: string
          example: /v1/blast-radius
        serviceTransactionId:
          type: string
          example: 523f52b2-64a5-465e-b245-3efbe78f70ae
      required:
      - message
      - path
      - status
      - timestamp
    AnalyzeBlastRadiusRequest:
      type: object
      properties:
        targetService:
          type: string
          description: Service being changed.
          example: payment-processor
        targetVersion:
          type: string
          description: Version being deployed.
          example: v2.5.0
        currentVersion:
          type: string
          description: Version currently deployed (baseline).
          example: v2.4.1
        environment:
          type: string
          description: Environment the change targets.
          enum:
          - STAGING
          - PRODUCTION
          example: PRODUCTION
        changeType:
          type: string
          description: Nature of the change.
          enum:
          - FEATURE
          - BUGFIX
          - HOTFIX
          - CONFIG_CHANGE
          - INFRA_CHANGE
          - DEPENDENCY_UPGRADE
          - DATABASE_MIGRATION
          - API_CONTRACT_CHANGE
          - ROLLBACK
          example: API_CONTRACT_CHANGE
        changeSummary:
          type: string
          description: What's actually changing (human-readable).
          example: Removing discount_code field from /charge request; adding discount_v2
            field.
        affectedEndpoints:
          type: array
          description: Specific API endpoints affected by the change.
          example:
          - POST /api/v1/charge
          - POST /api/v1/refund
          items:
            type: string
        changeWindowMinutes:
          type: integer
          format: int32
          description: How long the rollout will take.
          example: 30
        proposedCanaryPercent:
          type: integer
          format: int32
          description: Optional. Proposed canary traffic %.
          example: 5
          maximum: 100
          minimum: 1
        requestedBy:
          type: string
          description: Engineer requesting the analysis.
          example: amit.kumar@forgesphere.example.com
        pullRequestUrl:
          type: string
          format: uri
          description: Optional PR reference for audit.
          example: https://github.com/forgesphere/payment-service/pull/4821
      required:
      - changeType
      - environment
      - targetService
      - targetVersion
    FailureSimulation:
      type: object
      properties:
        simulationId:
          type: string
          format: uuid
          example: b1a2c3d4-e5f6-7890-1234-567890abcdef
        analysisId:
          type: string
          format: uuid
          example: 9c8f1a3b-6d7e-4a12-8f5e-123456789abc
        generatedAt:
          type: string
          format: date-time
        scenarios:
          type: array
          items:
            $ref: "#/components/schemas/FailureSimulationScenariosInner"
        overallRecommendation:
          $ref: "#/components/schemas/FailureSimulationOverallRecommendation"
        auditReference:
          type: string
          example: audit://blast-radius/simulation-b1a2c3d4
      required:
      - analysisId
      - generatedAt
      - overallRecommendation
      - scenarios
      - simulationId
    FailureSimulationOverallRecommendation:
      type: object
      properties:
        proceed:
          type: boolean
          example: false
        reasoning:
          type: string
          example: All scenarios exceed acceptable revenue loss ($50K threshold).
            Recommend splitting the change into smaller increments or deploying in
            a dedicated maintenance window with 1% canary.
        alternativeApproach:
          type: string
          example: "Deploy as a deprecation first (keep discount_code, add discount_v2),\
            \ then remove in a follow-up release."
        suggestedApprovalRequirements:
          type: array
          example:
          - VP Engineering
          - CISO
          - Customer Success Lead
          items:
            type: string
      required:
      - proceed
      - reasoning
    FailureSimulationScenariosInner:
      type: object
      properties:
        scenarioName:
          type: string
          example: 5% error rate at peak
        failureMode:
          type: string
          enum:
          - ERROR_RATE
          - LATENCY_SPIKE
          - COMPLETE_OUTAGE
          - DATA_CORRUPTION
          - PARTIAL_DEGRADATION
          - MEMORY_LEAK
          - CASCADING_FAILURE
          example: ERROR_RATE
        timeOfDay:
          type: string
          enum:
          - OFF_PEAK
          - NORMAL
          - PEAK
          - CRITICAL_WINDOW
          example: PEAK
        durationMinutes:
          type: integer
          format: int32
          example: 15
        userImpact:
          $ref: "#/components/schemas/FailureSimulationScenariosInnerUserImpact"
        revenueImpact:
          $ref: "#/components/schemas/FailureSimulationScenariosInnerRevenueImpact"
        recoverability:
          $ref: "#/components/schemas/FailureSimulationScenariosInnerRecoverability"
        cascadeRisk:
          type: array
          description: Which downstream services would also break.
          example:
          - checkout-service
          - order-service
          - notification-service
          items:
            type: string
        verdict:
          type: string
          enum:
          - ACCEPTABLE
          - HIGH_RISK
          - UNACCEPTABLE
          example: UNACCEPTABLE
      required:
      - failureMode
      - recoverability
      - revenueImpact
      - scenarioName
      - userImpact
    FailureSimulationScenariosInnerRecoverability:
      type: object
      properties:
        autoRollbackPossible:
          type: boolean
          example: true
        estimatedRecoveryMinutes:
          type: integer
          format: int32
          example: 8
        requiresManualIntervention:
          type: boolean
          example: false
        dataLossPossible:
          type: boolean
          example: false
    FailureSimulationScenariosInnerRevenueImpact:
      type: object
      properties:
        lostRevenueUSD:
          type: number
          format: double
          example: 31250.0
        compensationCostUSD:
          type: number
          format: double
          example: 8500.0
        slaCreditsOwedUSD:
          type: number
          format: double
          example: 15000.0
        totalCostUSD:
          type: number
          format: double
          example: 54750.0
    FailureSimulationScenariosInnerUserImpact:
      type: object
      properties:
        estimatedUsersAffected:
          type: integer
          format: int32
          example: 245000
        errorsBeforeRollback:
          type: integer
          format: int32
          example: 4280
        supportTicketsExpected:
          type: integer
          format: int32
          example: 342
        socialMediaMentions:
          type: integer
          format: int32
          example: 48
    SimulateFailuresRequest:
      type: object
      properties:
        scenarios:
          type: array
          description: Failure scenarios to simulate.
          items:
            $ref: "#/components/schemas/SimulateFailuresRequestScenariosInner"
          maxItems: 2147483647
          minItems: 1
        autoRollbackThresholds:
          $ref: "#/components/schemas/simulateFailures_request_autoRollbackThresholds"
      required:
      - scenarios
    SimulateFailuresRequestScenariosInner:
      type: object
      properties:
        scenarioName:
          type: string
          description: Human-readable name for the scenario.
          example: 5% error rate at peak
        failureMode:
          type: string
          description: How the change fails.
          enum:
          - ERROR_RATE
          - LATENCY_SPIKE
          - COMPLETE_OUTAGE
          - DATA_CORRUPTION
          - PARTIAL_DEGRADATION
          - MEMORY_LEAK
          - CASCADING_FAILURE
          example: ERROR_RATE
        errorRatePercent:
          type: number
          description: Required when failureMode = ERROR_RATE.
          example: 5.0
        latencyIncreaseMs:
          type: integer
          format: int32
          description: Required when failureMode = LATENCY_SPIKE.
          example: 500
        timeOfDay:
          type: string
          description: When the failure occurs.
          enum:
          - OFF_PEAK
          - NORMAL
          - PEAK
          - CRITICAL_WINDOW
          example: PEAK
        durationMinutes:
          type: integer
          format: int32
          description: How long before detection/rollback.
          example: 15
      required:
      - failureMode
      - scenarioName
    simulateFailures_request_autoRollbackThresholds:
      type: object
      description: Thresholds for automated rollback.
      properties:
        errorRatePercent:
          type: number
          example: 2.0
        latencyP99Ms:
          type: integer
          format: int32
          example: 1000
        customerComplaintsPerMinute:
          type: integer
          format: int32
          example: 10
    AnalysisList:
      type: object
      properties:
        content:
          type: array
          items:
            $ref: "#/components/schemas/BlastRadiusAnalysis"
        totalElements:
          type: integer
          format: int32
          example: 247
        totalPages:
          type: integer
          format: int32
          example: 13
        page:
          type: integer
          format: int32
          example: 0
        size:
          type: integer
          format: int32
          example: 20
        summary:
          $ref: "#/components/schemas/AnalysisListSummary"
      required:
      - content
      - totalElements
      - totalPages
    AnalysisListSummary:
      type: object
      properties:
        totalAnalyses:
          type: integer
          format: int32
          example: 247
        minimalRiskCount:
          type: integer
          format: int32
          example: 98
        lowRiskCount:
          type: integer
          format: int32
          example: 72
        mediumRiskCount:
          type: integer
          format: int32
          example: 48
        highRiskCount:
          type: integer
          format: int32
          example: 22
        catastrophicCount:
          type: integer
          format: int32
          example: 7
        totalRevenueAtRiskUSD:
          type: number
          format: double
          example: 845000.0
