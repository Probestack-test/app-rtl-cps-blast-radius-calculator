    analyzeBlastRadius_request:
      properties:
        targetService:
          description: Service being changed.
          example: payment-processor
          type: string
        targetVersion:
          description: Version being deployed.
          example: v2.5.0
          type: string
        currentVersion:
          description: Version currently deployed (baseline).
          example: v2.4.1
          type: string
        environment:
          description: Environment the change targets.
          enum:
          - STAGING
          - PRODUCTION
          example: PRODUCTION
          type: string
        changeType:
          description: Nature of the change.
          enum:
          - FEATURE
          - BUGFIX
          - HOTFIX
          - CONFIG_CHANGE
          - INFRA_CHANGE
          - DEPENDENCY_UPGRADE
          - DATABASE_MIGRATION
          - API_CONTRACT_CHANGE
          - ROLLBACK
          example: API_CONTRACT_CHANGE
          type: string
        changeSummary:
          description: What's actually changing (human-readable).
          example: Removing discount_code field from /charge request; adding discount_v2
            field.
          type: string
        affectedEndpoints:
          description: Specific API endpoints affected by the change.
          example:
          - POST /api/v1/charge
          - POST /api/v1/refund
          items:
            type: string
          type: array
        changeWindowMinutes:
          description: How long the rollout will take.
          example: 30
          type: integer
        proposedCanaryPercent:
          description: Optional. Proposed canary traffic %.
          example: 5
          maximum: 100
          minimum: 1
          type: integer
        requestedBy:
          description: Engineer requesting the analysis.
          example: amit.kumar@forgesphere.example.com
          type: string
        pullRequestUrl:
          description: Optional PR reference for audit.
          example: https://github.com/forgesphere/payment-service/pull/4821
          format: uri
          type: string
      required:
      - changeType
      - environment
      - targetService
      - targetVersion
      type: object
    simulateFailures_request_scenarios_inner:
      properties:
        scenarioName:
          description: Human-readable name for the scenario.
          example: 5% error rate at peak
          type: string
        failureMode:
          description: How the change fails.
          enum:
          - ERROR_RATE
          - LATENCY_SPIKE
          - COMPLETE_OUTAGE
          - DATA_CORRUPTION
          - PARTIAL_DEGRADATION
          - MEMORY_LEAK
          - CASCADING_FAILURE
          example: ERROR_RATE
          type: string
        errorRatePercent:
          description: Required when failureMode = ERROR_RATE.
          example: 5.0
          type: number
        latencyIncreaseMs:
          description: Required when failureMode = LATENCY_SPIKE.
          example: 500
          type: integer
        timeOfDay:
          default: PEAK
          description: When the failure occurs.
          enum:
          - OFF_PEAK
          - NORMAL
          - PEAK
          - CRITICAL_WINDOW
          example: PEAK
          type: string
        durationMinutes:
          description: How long before detection/rollback.
          example: 15
          type: integer
      required:
      - failureMode
      - scenarioName
      type: object
